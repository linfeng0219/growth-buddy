name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-build:
    name: Go + SQLite Server (Test & Package)
    runs-on: ubuntu-22.04
    outputs:
      build_ver: ${{ steps.build.outputs.build_ver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SQLite static dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libsqlite3-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Run Go unit & integration tests
        working-directory: server
        run: go test -v ./...

      - name: Test & build Fish Windows desktop client
        working-directory: fish
        run: |
          go test -v ./...
          mkdir -p ../server/public/downloads
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H windowsgui -s -w" -o ../server/public/downloads/fish.exe .
          ls -lh ../server/public/downloads/fish.exe

      - name: Build static-SQLite Linux binary
        id: build
        working-directory: server
        run: |
          BUILD_VER="$(TZ=Asia/Shanghai date +%Y.%m.%d-%H%M)"
          echo "BUILD_VER=${BUILD_VER}" >> "$GITHUB_ENV"
          echo "build_ver=${BUILD_VER}" >> "$GITHUB_OUTPUT"
          CGO_ENABLED=1 CGO_LDFLAGS="-Wl,-Bstatic -lsqlite3 -Wl,-Bdynamic -lm -ldl -lpthread" \
            go build -trimpath -ldflags="-s -w -X main.SystemVersion=${BUILD_VER}" -o growth-buddy-server .
          cp growth-buddy-server "growth-buddy-server-${BUILD_VER}"
          ls -lh growth-buddy-server "growth-buddy-server-${BUILD_VER}"
          ldd growth-buddy-server

      - name: Package Aliyun deployment tarball (with prebuilt binary)
        run: |
          STAGE="$(mktemp -d)"
          cp -a server/. "$STAGE/"
          rm -rf "$STAGE/data" "$STAGE/.env" "$STAGE"/growth-buddy-server*
          # Replace Dockerfile in release tarball with ultra-fast prebuilt binary image
          printf '%s\n' \
            'FROM debian:12-slim' \
            'WORKDIR /app' \
            'RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates tzdata && rm -rf /var/lib/apt/lists/*' \
            'ENV TZ=Asia/Shanghai' \
            'COPY growth-buddy-server /app/growth-buddy-server' \
            'RUN chmod +x /app/growth-buddy-server && mkdir -p /app/data/releases' \
            'EXPOSE 3000' \
            'CMD ["/app/growth-buddy-server"]' \
            > "$STAGE/Dockerfile"
          mkdir -p dist
          cp "server/growth-buddy-server" "dist/growth-buddy-server"
          cp "server/growth-buddy-server-${BUILD_VER}" "dist/growth-buddy-server-${BUILD_VER}"
          cp "server/public/downloads/fish.exe" "dist/fish.exe"
          tar -czf dist/growth-buddy-go-aliyun.tar.gz -C "$STAGE" .
          (cd dist && sha256sum "growth-buddy-server-${BUILD_VER}" growth-buddy-server growth-buddy-go-aliyun.tar.gz fish.exe > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload growth-buddy-server binary (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: growth-buddy-server-${{ env.BUILD_VER }}
          path: server/growth-buddy-server-${{ env.BUILD_VER }}
          compression-level: 0

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-release-files
          path: |
            dist/growth-buddy-server-${{ env.BUILD_VER }}
            dist/growth-buddy-server
            dist/growth-buddy-go-aliyun.tar.gz
            dist/fish.exe
            dist/SHA256SUMS.txt

  release:
    name: Publish GitHub Release (Raw Uncompressed Binary)
    if: github.event_name != 'pull_request'
    needs: [ server-build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for rolling latest tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: server-release-files
          path: release-files

      - name: Mark binaries executable
        run: chmod +x release-files/growth-buddy-server*

      - name: Update rolling latest tag and clear old binary assets
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            for a in $(gh release view latest --json assets -q '.assets[].name'); do
              gh release delete-asset latest "$a" --yes || true
            done
          fi

      - name: Publish Rolling Latest Release (main)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (${{ needs.server-build.outputs.build_ver }})"
          make_latest: "true"
          body: "每次推送 `main` 自动构建的最新 Linux `amd64` 静态服务端二进制（未压缩，下载后可直接拖入服务器运行）。"
          files: |
            release-files/growth-buddy-server-${{ needs.server-build.outputs.build_ver }}
            release-files/growth-buddy-server
            release-files/growth-buddy-go-aliyun.tar.gz
            release-files/fish.exe
            release-files/SHA256SUMS.txt

      - name: Publish Versioned GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/growth-buddy-server-${{ needs.server-build.outputs.build_ver }}
            release-files/growth-buddy-server
            release-files/growth-buddy-go-aliyun.tar.gz
            release-files/fish.exe
            release-files/SHA256SUMS.txt
