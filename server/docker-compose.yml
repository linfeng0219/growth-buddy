services:
  growth-buddy:
    build: .
    container_name: growth-buddy-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DB_PATH: "/app/data/growth_buddy.db"
      RELEASES_DIR: "/app/data/releases"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-to-a-long-random-secret}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin1234}"
    volumes:
      - ./data:/app/data
      - .:/app/host:ro
    command:
      - sh
      - -c
      - |
        BIN=$$(ls -1 /app/host/growth-buddy-server* 2>/dev/null | grep -E '/growth-buddy-server(-[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{4})?$$' | LC_ALL=C sort -r | head -n 1)
        if [ -n "$$BIN" ] && [ -f "$$BIN" ]; then
          echo "Using host binary: $$BIN"
          cp -f "$$BIN" /app/growth-buddy-server
        fi
        chmod +x /app/growth-buddy-server
        exec /app/growth-buddy-server
